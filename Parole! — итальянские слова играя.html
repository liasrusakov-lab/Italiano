function draw(){const w=q[i%q.length];let hints=0,done=false;
$("app").innerHTML=`<div class="top"><span>Слово ${i+1}</span><span>🔥 серия ${streak}</span></div>
<div class="card"><div class="tag">напиши по-итальянски · ${BL[w[2]][2]}</div><div class="big" style="font-size:clamp(24px,7vw,36px)">${w[1]}</div>
<input class="inp" id="in" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="…">
<div class="kb">${["à","è","é","ì","ò","ù"].map(c=>`<button data-k="${c}">${c}</button>`).join("")}</div>
<div class="row"><button class="btn d" id="hn">💡 Подсказка</button><button class="btn g" id="ck">Проверить</button></div><div class="fb" id="fb"></div></div>`;
const inp=$("in");inp.focus();
document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{inp.value+=b.dataset.k;inp.focus()});
$("hn").onclick=()=>{if(done)return;hints++;$("fb").textContent="Начинается на: "+w[0].slice(0,hints)+"…  ("+w[0].length+" симв.)"};
function next(){i++;draw()}
function check(){if(done){next();return}const v=inp.value;if(!v.trim())return;
const ok=nm(v)==nm(w[0]),near=!ok&&st(v)==st(w[0]);done=true;
if(ok||near){streak++;learned.add(w[0]);add(Math.max(5,20-5*hints)+(near?-3:0));inp.disabled=true;
$("fb").innerHTML=(near?"Почти! Ударения: <b>"+w[0]+"</b>":"Perfetto! ✨")+" ";setTimeout(next,near?1500:800)}
else{streak=0;inp.classList.add("shake");$("fb").innerHTML="Правильно: <b>"+w[0]+"</b>";$("ck").textContent="Дальше →";inp.disabled=true}}
$("ck").onclick=check;inp.onkeydown=e=>{if(e.key=="Enter")check()}}
draw()}
function login(a){cur=a;ls("p_cur",a.n);let d={};try{d=JSON.parse(ls("p_d_"+a.n)||"{}")}catch(e){}
xp=d.xp||0;learned=new Set(d.l||[]);earned=new Set(d.b||[]);$("mp").hidden=false;$("who").textContent=a.e+" "+a.n;$("who").hidden=false;$("main").hidden=false;head();go()}
function logout(){cur=null;ls("p_cur","");$("who").hidden=true;$("mp").hidden=true;$("main").hidden=true;$("lv").textContent="";$("st").textContent="";auth()}
const tabs=t=>`<div class="tabs"><button class="tab ${t=="in"?"on":""}" id="t1">Войти</button><button class="tab ${t=="up"?"on":""}" id="t2">Создать аккаунт</button></div>`;
const wire=()=>{$("t1").onclick=()=>auth("mail");$("t2").onclick=()=>auth("new")};
function auth(sel){$("main").hidden=true;if(sel===undefined)sel=accs.length?"mail":"new";
const mailOk=m=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m);
if(sel==="new"||(!accs.length&&sel===undefined)){let em=EM[0];
$("app").innerHTML=`<div class="card"><div class="big" style="font-size:30px">Benvenuto! 👋</div>${tabs("up")}<p class="hint">Прогресс сохранится на этом устройстве.</p>
<input class="inp" id="ml" type="email" autocomplete="email" placeholder="Электронная почта" style="font-size:16px">
<input class="inp" id="nm" maxlength="16" placeholder="Как тебя зовут?" autocomplete="off" style="font-size:16px">
<input class="inp" id="pw" type="password" autocomplete="new-password" placeholder="Пароль (от 6 символов)" style="font-size:16px">
<div class="emos">${EM.map(e=>`<button class="emo ${e==em?"on":""}" data-e="${e}">${e}</button>`).join("")}</div>
<div class="err" id="er"></div><div class="row"><button class="btn g" id="ok">Создать аккаунт</button></div></div>`;
document.querySelectorAll(".emo").forEach(b=>b.onclick=()=>{em=b.dataset.e;document.querySelectorAll(".emo").forEach(x=>x.classList.toggle("on",x===b))});
wire();
$("ok").onclick=()=>{const m=$("ml").value.trim().toLowerCase(),n=$("nm").value.trim(),pw=$("pw").value;
if(!mailOk(m))return $("er").textContent="Проверь адрес почты";
if(!n)return $("er").textContent="Введи имя";
if(pw.length<6)return $("er").textContent="Пароль — минимум 6 символов";
if(accs.some(a=>(a.m||"")==m))return $("er").textContent="Аккаунт с такой почтой уже есть";
if(accs.some(a=>a.n.toLowerCase()==n.toLowerCase()))return $("er").textContent="Такое имя уже занято";
const a={n,m,e:em,p:hsh(pw+n)};accs.push(a);ls("p_accs",JSON.stringify(accs));login(a)};return}
if(sel==="mail"){
$("app").innerHTML=`<div class="card"><div class="big" style="font-size:30px">Бон-джорно! ✉️</div>${tabs("in")}
<input class="inp" id="ml" type="email" placeholder="Электронная почта" style="font-size:16px"><input class="inp" id="pw" type="password" placeholder="Пароль" style="font-size:16px">
<div class="err" id="er"></div><div class="row"><button class="btn g" id="ok">Войти</button></div>${accs.length?'<p class="hint" style="margin-top:18px">Быстрый вход на этом устройстве</p><div class="emos">'+accs.map((a,i)=>`<button class="opt" data-i="${i}">${a.e} ${a.n}${a.p?" 🔒":""}</button>`).join("")+"</div>":""}</div>`;
wire();document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const a=accs[+b.dataset.i];a.p?auth(a):login(a)});
$("ok").onclick=()=>{const m=$("ml").value.trim().toLowerCase(),a=accs.find(x=>x.m==m);
if(!a||hsh($("pw").value+a.n)!=a.p)return $("er").textContent="Неверная почта или пароль";login(a)};
$("pw").onkeydown=e=>{if(e.key=="Enter")$("ok").click()};return}
if(sel===undefined){$("app").innerHTML=`<div class="card"><div class="big" style="font-size:30px">Chi sei? 🇮🇹</div><p class="hint">Выбери аккаунт на этом устройстве.</p>
<div class="opts">${accs.map((a,i)=>`<button class="opt" data-i="${i}">${a.e} ${a.n}${a.p?" 🔒":""}</button>`).join("")}<button class="btn g" id="nw">＋ Создать аккаунт</button><button class="btn d" id="ml">✉️ Войти по почте</button></div></div>`;
document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{const a=accs[+b.dataset.i];a.p?auth(a):login(a)});
$("nw").onclick=()=>auth("new");$("ml").onclick=()=>auth("mail");return}
const a=sel;let del=false;
$("app").innerHTML=`<div class="card"><div class="big">${a.e} ${a.n}</div><p class="hint">${a.m||""}<br>Введи пароль, чтобы войти</p>
<input class="inp" id="pn" type="password" placeholder="Пароль" style="font-size:16px"><div class="err" id="er"></div>
<div class="row"><button class="btn d" id="bk">Назад</button><button class="btn g" id="ok">Войти</button></div><button class="lnk" id="dl">Удалить аккаунт</button></div>`;
const okp=()=>hsh($("pn").value+a.n)==a.p;
$("bk").onclick=()=>auth();$("pn").focus();
$("ok").onclick=()=>okp()?login(a):$("er").textContent="Неверный пароль";
$("pn").onkeydown=e=>{if(e.key=="Enter")$("ok").click()};
$("dl").onclick=()=>{if(!okp())return $("er").textContent="Для удаления введи верный пароль";
if(!del){del=true;$("dl").textContent="Точно удалить? Нажми ещё раз";return}
accs=accs.filter(x=>x!==a);ls("p_accs",JSON.stringify(accs));ls("p_d_"+a.n,"");auth()}}
$("th").onclick=()=>{const d=document.documentElement,dk=getComputedStyle(d).getPropertyValue("--bg").trim()=="#1c1712";d.dataset.theme=dk?"light":"dark"};
$("who").onclick=logout;$("mp").onclick=mapView;
{const a=accs.find(x=>x.n==ls("p_cur"));a&&!a.p?login(a):auth()}
</script></body></html>
